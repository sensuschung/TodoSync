name: 同步到滴答清单

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 0-14/1,22,23 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore ./TodoSynchronizer.CLI/TodoSynchronizer.CLI.csproj
    - name: Build
      run: dotnet build ./TodoSynchronizer.CLI/TodoSynchronizer.CLI.csproj --no-restore -c Release
    - name: Write Dida Credential
      if: github.event_name != 'pull_request'
      env:
        DIDA_CREDENTIAL: ${{ secrets.DIDA_CREDENTIAL }}
      run: printf '%s' "$DIDA_CREDENTIAL" > dida.json
    - name: Run
      if: github.event_name != 'pull_request'
      env:
        CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
      run: ./TodoSynchronizer.CLI/bin/Release/net6.0/TodoSynchronizer.CLI -canvastoken "$CANVAS_TOKEN" -configfile config.yaml -didacredentialfile dida.json
